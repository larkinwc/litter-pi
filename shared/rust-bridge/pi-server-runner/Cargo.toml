[package]
name = "pi-server-runner"
version = "0.1.0"
edition = "2024"
publish = false
description = "Headless host runner for exercising the in-process pi coding agent runtime."

[[bin]]
name = "pi-server-runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
codex-mobile-client = { path = "../codex-mobile-client" }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
futures = { workspace = true }
pi-mobile-client = { path = "../pi-mobile-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
